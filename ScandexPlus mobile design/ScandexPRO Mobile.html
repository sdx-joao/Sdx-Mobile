<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ScandexPRO Mobile — Ordens de Serviço & Inventário</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body { font-family: 'Inter', system-ui, sans-serif; background: #0b0f1a; -webkit-font-smoothing: antialiased; }
    #root { min-height: 100vh; }
    /* hide scrollbars inside the phone for a native feel */
    ::-webkit-scrollbar { width: 0; height: 0; }
    button { font-family: inherit; }
    /* Splash / loading animations */
    @keyframes sdxPulseRing { 0% { transform: scale(0.85); opacity: .7; } 70% { transform: scale(1.55); opacity: 0; } 100% { opacity: 0; } }
    @keyframes sdxTileFloat { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    @keyframes sdxProgress { 0% { transform: translateX(-130%); } 100% { transform: translateX(330%); } }
    @keyframes sdxRingSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    .sdx-pulse { animation: sdxPulseRing 2.1s ease-out infinite; }
    .sdx-pulse-2 { animation-delay: 1.05s; }
    .sdx-tile-float { animation: sdxTileFloat 3s ease-in-out infinite; }
    .sdx-progress { animation: sdxProgress 1.25s ease-in-out infinite; }
    .sdx-ring { animation: sdxRingSpin 26s linear infinite; }
    @keyframes sdxSpin { to { transform: rotate(360deg); } }
    @keyframes sdxToastIn { from { transform: translateY(14px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    @keyframes sdxSheetIn { from { transform: translateY(100%); } to { transform: translateY(0); } }
    @keyframes sdxRecordIn { from { transform: translateY(8px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .sdx-spin { animation: sdxSpin .7s linear infinite; }
    @media (prefers-reduced-motion: reduce) {
      .sdx-pulse, .sdx-tile-float, .sdx-progress, .sdx-ring, .sdx-spin { animation: none; }
    }
  </style>
  <template id="__bundler_thumbnail">
    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <rect width="100" height="100" rx="22" fill="#0728CA"/>
      <rect x="32" y="20" width="36" height="60" rx="8" fill="#fff"/>
      <rect x="38" y="30" width="24" height="4" rx="2" fill="#0728CA"/>
      <rect x="38" y="40" width="24" height="14" rx="3" fill="#E6F0FF"/>
      <rect x="38" y="58" width="24" height="14" rx="3" fill="#E6F0FF"/>
    </svg>
  </template>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="mobile/ui.jsx"></script>
  <script type="text/babel" src="mobile/brand.jsx"></script>
  <script type="text/babel" src="mobile/data.jsx"></script>
  <script type="text/babel" src="mobile/tweaks-panel.jsx"></script>
  <script type="text/babel" src="mobile/workorders.jsx"></script>
  <script type="text/babel" src="mobile/inventory.jsx"></script>
  <script type="text/babel" src="mobile/records.jsx"></script>
  <script type="text/babel" src="mobile/app.jsx"></script>
  <script type="text/babel" data-presets="react">
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
