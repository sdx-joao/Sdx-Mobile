<!DOCTYPE html>
<!-- @dsCard group="Components" name="Navigation Header" subtitle="App header replica — brand, nav items, user chip" viewport="700x90" -->
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body { margin: 0; padding: 0; background: #fff; font-family: 'Inter', sans-serif; }
.header {
  background: #072AC8; color: #fff;
  height: 56px; display: flex; align-items: center;
  padding: 0 20px; gap: 0; justify-content: space-between;
}
.brand { font-size: 15px; font-weight: 700; letter-spacing: -.02em; white-space: nowrap; margin-right: 16px; }
.divider { width: 1px; height: 20px; background: rgba(255,255,255,.2); margin: 0 12px; flex-shrink: 0; }
nav { display: flex; align-items: center; gap: 2px; flex: 1; }
.nav-item {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  width: 52px; height: 44px; border-radius: 8px; border: none; background: transparent;
  color: rgba(255,255,255,.6); cursor: pointer; position: relative; transition: all .15s; gap: 3px;
  font-family: 'Inter', sans-serif;
}
.nav-item:hover { background: rgba(255,255,255,.15); color: #fff; }
.nav-item.active { background: rgba(255,255,255,.22); color: #fff; }
.nav-item .lbl { font-size: 8.5px; font-weight: 500; line-height: 1; }
svg { display: block; }
.dot { position: absolute; top: 6px; right: 8px; width: 6px; height: 6px; border-radius: 50%; background: #f87171; border: 1.5px solid #072AC8; }
.user { display: flex; align-items: center; gap: 8px; margin-left: 12px; }
.avatar { width: 28px; height: 28px; border-radius: 6px; background: rgba(255,255,255,.2); border: 1.5px solid rgba(255,255,255,.35); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; }
.logout { background: transparent; border: none; color: rgba(255,255,255,.55); cursor: pointer; padding: 6px; border-radius: 6px; display: flex; align-items: center; }
.logout:hover { background: rgba(255,255,255,.15); color: #fff; }
</style>
</head><body>
<div class="header">
  <div class="brand">ScandexPRO™</div>
  <div class="divider"></div>
  <nav>
    <!-- Dashboard -->
    <button class="nav-item active" title="Painel Principal">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
        <rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/>
      </svg>
      <span class="lbl">Painel</span>
    </button>
    <!-- Comunicação -->
    <button class="nav-item" title="Comunicação" style="position:relative">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
      </svg>
      <span class="lbl">Mensagens</span>
      <span class="dot"></span>
    </button>
    <!-- Cadastrar -->
    <button class="nav-item" title="Cadastrar Paciente">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
        <circle cx="9" cy="7" r="4"/>
        <line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/>
      </svg>
      <span class="lbl">Cadastro</span>
    </button>
    <!-- Relatórios -->
    <button class="nav-item" title="Relatórios">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/>
      </svg>
      <span class="lbl">Relatórios</span>
    </button>
    <!-- Admin -->
    <button class="nav-item" title="Área Admin">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z"/><path d="m9 12 2 2 4-4"/>
      </svg>
      <span class="lbl">Admin</span>
    </button>
  </nav>
  <div class="divider"></div>
  <!-- User -->
  <div class="user">
    <div class="avatar">JC</div>
    <div style="line-height:1.2">
      <div style="font-size:11px;font-weight:600">João Costa</div>
      <div style="font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;opacity:.65">Admin</div>
    </div>
    <button class="logout" title="Sair">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>
      </svg>
    </button>
  </div>
</div>
</body></html>
