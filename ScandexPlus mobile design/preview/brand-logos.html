<!DOCTYPE html>
<!-- @dsCard group="Brand" name="Brand & Logos" subtitle="ScandexPRO™ wordmark, Hospital do Olho client logo" viewport="700x200" -->
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body { margin: 0; padding: 24px; background: #fff; font-family: 'Inter', sans-serif; display: flex; flex-direction: column; gap: 24px; }
.row { display: flex; gap: 32px; align-items: flex-start; }
.logo-box { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
.logo-on-dark { background: #072AC8; padding: 14px 20px; border-radius: 8px; display: flex; align-items: center; gap: 8px; }
.brand-text { font-size: 20px; font-weight: 700; letter-spacing: -0.02em; color: #fff; }
.logo-on-light { background: #fff; padding: 14px 20px; border: 1px solid hsl(214.3 31.8% 91.4%); border-radius: 8px; display: flex; align-items: center; gap: 8px; }
.brand-text-light { font-size: 20px; font-weight: 700; letter-spacing: -0.02em; color: #072AC8; }
.meta { font-size: 10px; color: #9ca3af; }
img { display: block; }
</style>
</head><body>
<div class="row">
  <div class="logo-box">
    <div class="logo-on-dark"><span class="brand-text">ScandexPRO™</span></div>
    <div class="meta">Header / dark bg</div>
  </div>
  <div class="logo-box">
    <div class="logo-on-light"><span class="brand-text-light">ScandexPRO™</span></div>
    <div class="meta">Light context</div>
  </div>
</div>
<div class="row">
  <div class="logo-box">
    <img src="../assets/ho-logo.png" height="100" alt="Hospital do Olho logo" />
    <div class="meta">Client: Hospital do Olho Julio Cândido de Brito<br>(shown at login screen)</div>
  </div>
  <div class="logo-box">
    <img src="../assets/logo-02.png" height="80" alt="ScandexPlus logo" style="border-radius:50%;background:#f5f5f5;padding:4px" />
    <div class="meta">ScandexPlus brand mark<br>(powered-by context)</div>
  </div>
</div>
</body></html>
