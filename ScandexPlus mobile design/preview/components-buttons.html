<!DOCTYPE html>
<!-- @dsCard group="Components" name="Buttons" subtitle="Primary, destructive, outline, ghost, accent — all sizes" viewport="700x200" -->
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body { margin: 0; padding: 16px; background: #f8f9fb; font-family: 'Inter', sans-serif; }
.section { margin-bottom: 18px; }
.label { font-size: 10px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: #6b7280; margin-bottom: 8px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 8px 16px; border-radius: 8px; font-size: 13px; font-weight: 500;
  border: 1px solid transparent; cursor: pointer; transition: all 0.15s ease;
  font-family: 'Inter', sans-serif;
}
.btn-primary { background: #072AC8; color: #fff; }
.btn-primary:hover { background: #fff; color: #072AC8; border-color: #072AC8; }
.btn-destructive { background: hsl(0 84.2% 60.2%); color: #fff; }
.btn-outline { background: #fff; color: hsl(222.2 84% 4.9%); border-color: hsl(214.3 31.8% 91.4%); }
.btn-outline:hover { background: hsl(210 40% 96.1%); }
.btn-ghost { background: transparent; color: hsl(222.2 84% 4.9%); }
.btn-ghost:hover { background: hsl(210 40% 96.1%); }
.btn-secondary { background: hsl(210 40% 96.1%); color: hsl(222.2 47.4% 11.2%); }
.btn-accent { background: #4DB6AC; color: #fff; }
.btn-sm { padding: 5px 10px; font-size: 12px; border-radius: 6px; }
.btn-icon { padding: 8px; border-radius: 8px; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
</style>
</head><body>
<div class="section">
  <div class="label">Primary Actions</div>
  <div class="row">
    <button class="btn btn-primary">
      <svg viewBox="0 0 24 24"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
      Entrar
    </button>
    <button class="btn btn-primary" disabled>
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
      Carregando...
    </button>
    <button class="btn btn-destructive">
      <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>
      Excluir
    </button>
  </div>
</div>
<div class="section">
  <div class="label">Secondary &amp; Ghost</div>
  <div class="row">
    <button class="btn btn-outline">Cancelar</button>
    <button class="btn btn-secondary">
      <svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
      Visualizar
    </button>
    <button class="btn btn-ghost">
      <svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
      Editar
    </button>
    <button class="btn btn-accent">
      <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      Baixar
    </button>
  </div>
</div>
<div class="section">
  <div class="label">Small &amp; Icon Sizes</div>
  <div class="row">
    <button class="btn btn-primary btn-sm">Salvar</button>
    <button class="btn btn-outline btn-sm">Fechar</button>
    <button class="btn btn-ghost btn-icon">
      <svg width="16" height="16" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
    <button class="btn btn-ghost btn-icon">
      <svg width="16" height="16" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    </button>
    <button class="btn btn-ghost btn-icon" style="color:#072AC8">
      <svg width="16" height="16" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
    </button>
  </div>
</div>
</body></html>
