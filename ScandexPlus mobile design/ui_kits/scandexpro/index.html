// ── Icons (inline Lucide-style SVGs) ─────────────────────────────────────
const Ico = ({ d, size=16, color='currentColor', ...extra }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" style={{flexShrink:0}}>
    {d && <path d={d}/>}
    {extra.circle && <circle {...extra.circle}/>}
    {extra.line && <line {...extra.line}/>}
    {extra.polyline && <polyline points={extra.polyline}/>}
    {extra.rect && <rect {...extra.rect}/>}
  </svg>
);
const IcoSearch = ({s=16}) => <Ico size={s} d="M21 21l-4.35-4.35M17 11A6 6 0 1 1 5 11a6 6 0 0 1 12 0z"/>;
const IcoDash  = ({s=16}) => <svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>;
const IcoMsg   = ({s=16}) => <Ico size={s} d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>;
const IcoUser  = ({s=16}) => <svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></svg>;
const IcoBar   = ({s=16}) => <svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>;
const IcoOut   = ({s=16}) => <Ico size={s} d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>;
const IcoFile  = ({s=16}) => <Ico size={s} d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>;

const IcoPrint = ({s=16}) => <Ico size={s} d="M6 9V2h12v7M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2M6 14h12v8H6z"/>;
const IcoChev  = ({s=16,up=false}) => <Ico size={s} d={up?"M18 15l-6-6-6 6":"M6 9l6 6 6-6"}/>;
const IcoX     = ({s=16}) => <Ico size={s} d="M18 6 6 18M6 6l12 12"/>;
const IcoAlert = ({s=16}) => <Ico size={s} d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z" line={{x1:"12",y1:"9",x2:"12",y2:"13"}} circle={{cx:"12",cy:"17",r:"1"}}/>;
const IcoSettings = ({s=16}) => <Ico size={s} d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/>;

const THEME_MODES = [
  { id: 'favorito', label: 'Favorito', primary: '#245594', bg: '#f4f7fc',
    icon: (c) => <svg width="14" height="14" viewBox="0 0 24 24" fill={c} stroke={c} strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg> },
  { id: 'claro',    label: 'Claro',    primary: '#0284c7', bg: '#f0f9ff',
    icon: (c) => <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg> },
  { id: 'escuro',   label: 'Escuro',   primary: '#1e293b', bg: '#0f172a',
    icon: (c) => <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg> },
];

// ── App Header ────────────────────────────────────────────────────────────
const AppHeader = ({ screen, setScreen, notifCount = 2, theme, setTheme, app, setApp }) => {
  const primary = theme?.primary || '#245594';
  const nav = [
    { id: 'dashboard',     label: 'Painel',     Icon: IcoDash },
    { id: 'communication', label: 'Mensagens',  Icon: IcoMsg, badge: notifCount },
    { id: 'users',         label: 'Usuários',   Icon: IcoUsers },
    { id: 'reports',       label: 'Relatórios', Icon: IcoBar },
    { id: 'admin',         label: 'Admin',      Icon: IcoGauge },
  ];
  const themeIdx = THEME_MODES.findIndex(t => t.id === theme?.id) ?? 0;
  const cycleTheme = () => setTheme(THEME_MODES[(themeIdx + 1) % THEME_MODES.length]);
  const curTheme = THEME_MODES[themeIdx] || THEME_MODES[0];

  return (
    <header style={{
      background: primary, color: '#fff', height: 56,
      display: 'flex', alignItems: 'center', justifyContent: 'space-between',
      padding: '0 20px', position: 'sticky', top: 0, zIndex: 50,
      boxShadow: '0 1px 6px rgba(0,0,0,0.15)', borderBottom: '1px solid rgba(255,255,255,0.1)',
      flexShrink: 0, gap: 0,
    }}>
      {/* Brand + theme cycle */}
      <div style={{ display: 'flex', alignItems: 'center', gap: 6, flexShrink: 0 }}>
        <div onClick={() => setScreen('dashboard')} style={{ fontSize: 15, fontWeight: 700, letterSpacing: '-0.01em', cursor: 'pointer', userSelect: 'none', whiteSpace: 'nowrap', fontFamily: "'Space Grotesk', sans-serif" }}>
          ScandexPRO™
        </div>
        {/* 3-state theme cycle — bare icon, no box */}
        <button onClick={cycleTheme} title={`Tema: ${curTheme.label}`} style={{
          background: 'none', border: 'none', padding: '3px',
          cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center',
          color: 'rgba(255,255,255,.6)', transition: 'color .2s', flexShrink: 0,
        }}
        onMouseEnter={e => e.currentTarget.style.color='rgba(255,255,255,1)'}
        onMouseLeave={e => e.currentTarget.style.color='rgba(255,255,255,.6)'}>
          {curTheme.icon('currentColor')}
        </button>
      </div>

      {/* Divider */}
      <div style={{ width: 1, height: 20, background: 'rgba(255,255,255,.2)', margin: '0 10px', flexShrink: 0 }}/>

      {/* Nav — icon + label stacked */}
      <nav style={{ display: 'flex', alignItems: 'center', gap: 2, flex: 1 }}>
        {nav.map(({ id, label, Icon: NavIcon, badge }) => {
          const active = screen === id;
          return (
            <button key={id} onClick={() => setScreen(id)} title={label} style={{
              display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center',
              width: 52, height: 44, borderRadius: 8, border: 'none', cursor: 'pointer', position: 'relative',
              background: active ? 'rgba(255,255,255,.22)' : 'transparent',
              color: active ? '#fff' : 'rgba(255,255,255,.6)',
              fontFamily: "'DM Sans', sans-serif", gap: 3, transition: 'all .15s', flexShrink: 0,
            }}
            onMouseEnter={e => { e.currentTarget.style.background='rgba(255,255,255,.15)'; e.currentTarget.style.color='#fff'; }}
            onMouseLeave={e => { e.currentTarget.style.background=active?'rgba(255,255,255,.22)':'transparent'; e.currentTarget.style.color=active?'#fff':'rgba(255,255,255,.6)'; }}>
              <NavIcon s={16}/>
              <span style={{ fontSize: 8.5, fontWeight: 500, lineHeight: 1 }}>{label}</span>
              {badge > 0 && (
                <span style={{ position: 'absolute', top: 6, right: 8, width: 6, height: 6, borderRadius: '50%', background: '#f87171', border: `1.5px solid ${primary}` }}/>
              )}
            </button>
          );
        })}
      </nav>

      {/* Divider */}
      <div style={{ width: 1, height: 20, background: 'rgba(255,255,255,.2)', margin: '0 12px', flexShrink: 0 }}/>

      {/* User */}
      <div style={{ display: 'flex', alignItems: 'center', gap: 8, flexShrink: 0 }}>
        <div style={{
          width: 28, height: 28, borderRadius: 6, background: 'rgba(255,255,255,.2)',
          border: '1.5px solid rgba(255,255,255,.35)', display: 'flex', alignItems: 'center',
          justifyContent: 'center', fontSize: 11, fontWeight: 700,
        }}>{MOCK_USER.initials}</div>
        <div style={{ lineHeight: 1.2 }}>
          <div style={{ fontSize: 11, fontWeight: 600 }}>{MOCK_USER.name}</div>
          <div style={{ fontSize: 9, fontWeight: 700, textTransform: 'uppercase', letterSpacing: '.04em', opacity: .65 }}>{MOCK_USER.role}</div>
        </div>
        <button onClick={() => setScreen('login')} title="Sair" style={{
          background: 'transparent', border: 'none', color: 'rgba(255,255,255,.55)',
          cursor: 'pointer', padding: 6, borderRadius: 6, display: 'flex', alignItems: 'center',
        }}
        onMouseEnter={e => { e.currentTarget.style.background='rgba(255,255,255,.15)'; e.currentTarget.style.color='#fff'; }}
        onMouseLeave={e => { e.currentTarget.style.background='transparent'; e.currentTarget.style.color='rgba(255,255,255,.55)'; }}>

};

// ── Login Screen ──────────────────────────────────────────────────────────
const LoginScreen = ({ onLogin }) => {
  const [user, setUser] = useState('');
  const [pass, setPass] = useState('');
  const [loading, setLoading] = useState(false);
  const [err, setErr] = useState('');

  const submit = (e) => {
    e.preventDefault();
    setErr('');
    if (!user || !pass) { setErr('Preencha todos os campos.'); return; }
    setLoading(true);
    setTimeout(() => { setLoading(false); onLogin(); }, 900);
  };

  return (
    <div style={{ display: 'flex', height: '100%', minHeight: '100vh', background: '#fff' }}>
      {/* Left — image */}
      <div style={{ flex: 1, position: 'relative', overflow: 'hidden', display: 'flex', alignItems: 'center', justifyContent: 'center', background: '#1a2744' }}>
        <img src="../../assets/hospital.png" alt="Hospital" style={{ position: 'absolute', inset: 0, width: '100%', height: '100%', objectFit: 'cover', opacity: 0.7 }}/>
        <div style={{ position: 'absolute', inset: 0, background: 'rgba(36,85,148,0.35)' }}/>
        <div style={{ position: 'relative', color: '#fff', textAlign: 'center', padding: 32 }}>
          <div style={{ fontSize: 14, letterSpacing: '.15em', textTransform: 'uppercase', opacity: .7, marginBottom: 8 }}>Bem-vindo ao</div>
          <div style={{ fontSize: 36, fontWeight: 700, letterSpacing: '-0.03em' }}>ScandexPRO™</div>
          <div style={{ fontSize: 13, opacity: .65, marginTop: 8 }}>Gerenciamento Eletrônico de Documentos</div>
        </div>
      </div>
      {/* Right — form */}
      <div style={{ width: 440, flexShrink: 0, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', padding: '48px 40px', background: '#fff' }}>
        <div style={{ width: '100%', maxWidth: 340 }}>
          {/* Client logo */}
          <div style={{ display: 'flex', justifyContent: 'center', marginBottom: 28 }}>
            <img src="../../assets/ho-logo.png" alt="Hospital do Olho" style={{ height: 110 }}/>
          </div>
          <div style={{ fontSize: 22, fontWeight: 700, textAlign: 'center', color: '#1e2d42', marginBottom: 4 }}>Entrar</div>
          <div style={{ fontSize: 13, color: '#7a8fa8', textAlign: 'center', marginBottom: 24 }}>
            Insira suas credenciais para acessar o ScandexPRO™.
          </div>
          <form onSubmit={submit}>
            <div style={{ marginBottom: 14 }}>
              <label style={{ display: 'block', fontSize: 13, fontWeight: 500, marginBottom: 5, color: '#1e2d42' }}>Nome de Usuário</label>
              <input type="text" placeholder="ex: nome" value={user} onChange={e => setUser(e.target.value)}
                style={{ width: '100%', padding: '9px 12px', background: '#f6f8fc', border: '1.5px solid #dce8f5', borderRadius: 7, fontSize: 13, outline: 'none', transition: 'all 0.15s', color: '#1e2d42' }}
                onFocus={e => { e.target.style.borderColor = '#245594'; e.target.style.boxShadow = '0 0 0 2px rgba(36,85,148,.15)'; }}
                onBlur={e => { e.target.style.borderColor = '#8a9db8'; e.target.style.boxShadow = 'none'; }}
              />
            </div>
            <div style={{ marginBottom: 20 }}>
              <label style={{ display: 'block', fontSize: 13, fontWeight: 500, marginBottom: 5, color: '#1e2d42' }}>Senha</label>
              <input type="password" placeholder="ex: senha" value={pass} onChange={e => setPass(e.target.value)}
                style={{ width: '100%', padding: '9px 12px', background: '#f6f8fc', border: '1.5px solid #dce8f5', borderRadius: 7, fontSize: 13, outline: 'none', transition: 'all 0.15s', color: '#1e2d42' }}
                onFocus={e => { e.target.style.borderColor = '#245594'; e.target.style.boxShadow = '0 0 0 2px rgba(36,85,148,.15)'; }}
                onBlur={e => { e.target.style.borderColor = '#8a9db8'; e.target.style.boxShadow = 'none'; }}
              />
            </div>
            {err && <div style={{ fontSize: 12, color: '#dc2626', marginBottom: 12 }}>{err}</div>}
            <button type="submit" disabled={loading} style={{
              width: '100%', padding: '10px', background: loading ? '#3a57d9' : '#245594', color: '#fff',
              border: '1px solid transparent', borderRadius: 8, fontSize: 14, fontWeight: 500,
              cursor: loading ? 'not-allowed' : 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 8,
              fontFamily: "'DM Sans', sans-serif", transition: 'all 0.15s',
            }}>
              {loading ? (
                <><span style={{ display: 'inline-block', width: 14, height: 14, border: '2px solid rgba(255,255,255,.4)', borderTopColor: '#fff', borderRadius: '50%', animation: 'spin 0.7s linear infinite' }}/> Entrando...</>
              ) : (<>
                <IcoOut s={15}/>Entrar
              </>)}
            </button>
          </form>
          <div style={{ display: 'flex', justifyContent: 'center', alignItems: 'center', gap: 6, marginTop: 32, color: '#8a9db8', fontSize: 13 }}>
            <span style={{ fontStyle: 'italic' }}>powered by</span>
            <img src="../../assets/logo-02.png" alt="ScandexPlus" style={{ width: 22, height: 22, borderRadius: '50%', background: '#f5f5f5' }}/>
          </div>
        </div>
      </div>
    </div>
  );
};

// ── Dashboard Screen ──────────────────────────────────────────────────────
const DashboardScreen = ({ setScreen, app, setApp }) => {
  const [prontuario, setProntuario] = useState('');
  const [cpf, setCpf] = useState('');
  const [patient, setPatient] = useState(null);
  const [loading, setLoading] = useState(false);
  const [notFound, setNotFound] = useState(false);
  const [selectedDoc, setSelectedDoc] = useState(null);

  const doSearch = () => {
    const q = prontuario.trim() || cpf.trim();
    if (!q || q.length < 5) return;
    setLoading(true); setPatient(null); setNotFound(false); setSelectedDoc(null);
    setTimeout(() => {
      const found = MOCK_PATIENTS.find(p =>
        p.id === prontuario.trim() ||
        p.cpf.replace(/\D/g,'') === cpf.replace(/\D/g,'') ||
        p.name.toLowerCase().includes(q.toLowerCase())
      );
      setLoading(false);
      if (found) setPatient(found); else setNotFound(true);
    }, 600);
  };

  const resetSearch = () => {
    setProntuario(''); setCpf(''); setPatient(null);
    setNotFound(false); setSelectedDoc(null);
  };

  const statusLabel = { available: 'Disponível', absent: 'Ausente', missing_info: 'Incompleto', processing: 'Processando', altered: 'Alterado' };

  return (
    <div style={{ flex: 1, overflow: 'auto', background: '#f4f7fc' }}>

      {/* ── Hero search area ── */}
      {!patient && !loading && !notFound && (
        <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', padding: '52px 24px 40px', minHeight: 340 }}>

          {/* App selector — ghost inline, no visible box */}
          <div style={{ display: 'flex', alignItems: 'center', gap: 0, marginBottom: 28, position: 'relative' }}>
            {APPLICATIONS.map((a, i) => {
              const sel = app?.id === a.id;
              return (
                <button key={a.id} onClick={() => setApp(a)} style={{
                  background: 'none', border: 'none', cursor: 'pointer',
                  padding: '4px 14px', fontFamily: "'DM Sans', sans-serif",
                  fontSize: 13, fontWeight: sel ? 700 : 400,
                  color: sel ? '#245594' : '#8a9db8',
                  borderBottom: sel ? '2px solid #245594' : '2px solid transparent',
                  transition: 'all .15s', letterSpacing: sel ? '-.01em' : 'normal',
                  borderLeft: i > 0 ? '1px solid #e5e7eb' : 'none',
                }}>
                  {a.label}
                </button>
              );
            })}
          </div>

          {/* Title */}
          <div style={{ fontSize: 26, fontWeight: 700, color: '#1e2d42', marginBottom: 6, letterSpacing: '-.025em', textAlign: 'center', fontFamily: "'Space Grotesk', sans-serif" }}>
            {app?.label || 'Pesquisa de Paciente'}
          </div>
          <div style={{ fontSize: 13, color: '#8a9db8', marginBottom: 36, textAlign: 'center' }}>
            Informe o prontuário <b>ou</b> o CPF para localizar o paciente

  const [app, setApp] = useState(APPLICATIONS[0]);
  const [updateAvailable, setUpdateAvailable] = useState(false);
  const [checking, setChecking] = useState(false);

  useEffect(() => { localStorage.setItem('sdx_screen', screen); }, [screen]);

  const handleLogin = () => {
    setScreen('dashboard');
    setToast({ title: 'Login Bem-Sucedido', desc: 'Bem-vindo de volta ao ScandexPRO™!', variant: 'accent' });
    setTimeout(() => setToast(null), 3000);
  };

  const screenMap = {
    dashboard:     <DashboardScreen setScreen={setScreen} app={app} setApp={setApp} />,
    communication: <CommunicationScreen />,
    users:         <UsersScreen />,
    reports:       <ReportsScreen />,
    admin:         <AdminScreen />,
  };

  if (screen === 'login') return (
    <>
      <style>{`@keyframes spin { to { transform: rotate(360deg); } }`}</style>
      <LoginScreen onLogin={handleLogin} />
      {toast && <SDXToast {...toast} onClose={() => setToast(null)} />}
    </>
  );

  return (
    <>
      <style>{`@keyframes spin { to { transform: rotate(360deg); } } @keyframes fadeIn { from { opacity:0; transform:translateY(3px); } to { opacity:1; transform:translateY(0); } }`}</style>
      <div style={{ display: 'flex', flexDirection: 'column', height: '100vh' }}>
        <AppHeader screen={screen} setScreen={setScreen} notifCount={2} theme={theme} setTheme={setTheme} app={app} setApp={setApp} />
        <div style={{ flex: 1, overflow: 'auto', display: 'flex', flexDirection: 'column' }}>
          {screenMap[screen] || <DashboardScreen setScreen={setScreen} />}
        </div>

        {/* ── Footer ── */}
        <footer style={{
          flexShrink: 0, height: 36, background: '#fff',
          borderTop: '1px solid #dce8f5',
          display: 'flex', alignItems: 'center', justifyContent: 'space-between',
          padding: '0 16px',
        }}>
          {/* Left — version + update check */}
          <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
            <button onClick={() => {
              if (checking) return;
              setChecking(true);
              setUpdateAvailable(false);
              setTimeout(() => { setChecking(false); setUpdateAvailable(true); }, 1800);
            }} style={{
              background: 'none', border: 'none', cursor: checking ? 'wait' : 'pointer',
              display: 'flex', alignItems: 'center', gap: 5,
              fontSize: 11, color: '#8a9db8', fontFamily: "'DM Sans', sans-serif",
              padding: '3px 7px', borderRadius: 5, transition: 'all .15s',
            }}
            onMouseEnter={e => { e.currentTarget.style.background='hsl(210,40%,96.1%)'; e.currentTarget.style.color='#374151'; }}
            onMouseLeave={e => { e.currentTarget.style.background='none'; e.currentTarget.style.color='#8a9db8'; }}>
              <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"
                style={{ animation: checking ? 'spin 0.7s linear infinite' : 'none' }}>
                <polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
              </svg>
              ScandexPRO™ v2.4.1
            </button>
            {updateAvailable && (
              <span style={{
                fontSize: 10, fontWeight: 600, background: '#fef9c3', color: '#854d0e',
                border: '1px solid #fde047', borderRadius: 5, padding: '2px 7px',
                animation: 'fadeIn .3s ease',
              }}>
                ✦ v2.5.0 disponível
              </span>
            )}
          </div>

          {/* Right — guide & support */}
          <div style={{ display: 'flex', gap: 4 }}>
            <button onClick={() => setSupportModal(true)} style={{
              background: 'none', border: 'none', cursor: 'pointer',
              display: 'flex', alignItems: 'center', gap: 5,
              fontSize: 11, color: '#8a9db8', fontFamily: "'DM Sans', sans-serif",
              padding: '3px 8px', borderRadius: 5, transition: 'all .15s',
            }}
            onMouseEnter={e => { e.currentTarget.style.background='hsl(210,40%,96.1%)'; e.currentTarget.style.color='#374151'; }}
            onMouseLeave={e => { e.currentTarget.style.background='none'; e.currentTarget.style.color='#8a9db8'; }}>
              <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/>
              </svg>
              Guia &amp; Suporte
            </button>
          </div>
        </footer>
      </div>

      {/* Support modal */}
      {supportModal && (
        <div style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,.4)', zIndex: 200, display: 'flex', alignItems: 'center', justifyContent: 'center' }} onClick={() => setSupportModal(false)}>
          <div style={{ background: '#fff', borderRadius: 12, padding: '24px 28px', width: 340, boxShadow: '0 20px 40px rgba(0,0,0,.2)' }} onClick={e => e.stopPropagation()}>
            <div style={{ fontSize: 16, fontWeight: 700, color: '#1e2d42', marginBottom: 4 }}>Guia &amp; Suporte</div>
            <div style={{ fontSize: 12, color: '#7a8fa8', marginBottom: 18 }}>Recursos de ajuda para o ScandexPRO™</div>
            {[
              { icon: '📖', label: 'Manual do Usuário', desc: 'Documentação completa do sistema' },
              { icon: '🎥', label: 'Vídeos Tutoriais', desc: 'Aprenda com demonstrações em vídeo' },
              { icon: '💬', label: 'Suporte Técnico', desc: 'Abrir chamado com a equipe Scandex' },
              { icon: '🔔', label: 'Reportar Problema', desc: 'Envie um bug ou sugestão de melhoria' },
            ].map(({ icon, label, desc }) => (
              <div key={label} style={{ display: 'flex', alignItems: 'center', gap: 12, padding: '10px 0', borderBottom: '1px solid #dce8f5', cursor: 'pointer' }}
                onMouseEnter={e => e.currentTarget.style.opacity='.7'} onMouseLeave={e => e.currentTarget.style.opacity='1'}>
                <span style={{ fontSize: 18 }}>{icon}</span>
                <div>
                  <div style={{ fontSize: 13, fontWeight: 600, color: '#1e2d42' }}>{label}</div>
                  <div style={{ fontSize: 11, color: '#8a9db8' }}>{desc}</div>
                </div>
              </div>
            ))}
            <button onClick={() => setSupportModal(false)} style={{ marginTop: 16, width: '100%', padding: '8px', background: 'hsl(210,40%,96.1%)', border: 'none', borderRadius: 7, cursor: 'pointer', fontSize: 13, fontFamily: "'DM Sans', sans-serif", color: '#2d4560', fontWeight: 500 }}>Fechar</button>
          </div>
        </div>
      )}
    
      {toast && <SDXToast {...toast} onClose={() => setToast(null)} />}
    </> 
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
