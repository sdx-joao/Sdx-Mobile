<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8" />

<style>
  body { margin: 0; background: var(--sdx-m-bg, #F5F7FB); font-family: 'Inter', sans-serif; padding: 26px; display: flex; justify-content: center; }
  .col { width: 340px; display: flex; flex-direction: column; gap: 16px; }
  .lbl { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--sdx-m-muted, #64748B); margin-bottom: -8px; }
</style>
</head><body>
<div id="root" class="col"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
  const { SegmentedControl } = window.ScandexPlusDesignSystem_c9a9df;
  function Demo() {
    const [app, setApp] = React.useState('surg');
    const [tab, setTab] = React.useState('all');
    return (
      <>
        <div className="lbl">Seletor de aplicação</div>
        <SegmentedControl value={app} onChange={setApp} options={[
          { key: 'surg', label: 'Cirurgias — HO' }, { key: 'legal', label: 'Jurídico — HO' },
        ]} />
        <div className="lbl">Abas com contagem</div>
        <SegmentedControl value={tab} onChange={setTab} options={[
          { key: 'all', label: 'Todas', count: 5 },
          { key: 'done', label: 'Realizadas', count: 4 },
          { key: 'canc', label: 'Canceladas', count: 1 },
        ]} />
      </>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body></html>
