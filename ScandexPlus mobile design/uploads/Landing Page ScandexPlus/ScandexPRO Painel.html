// ────────────────────────────────────────────────────────────
// CountUp helper (mesma lógica da landing)
// ────────────────────────────────────────────────────────────
const CountUp = ({ to, suffix = '', decimals = 0, style }) => {
  const ref = useRef();
  const [n, setN] = useState(0);
  useEffect(() => {
    const start = performance.now();
    const dur = 1400;
    let raf;
    const tick = (t) => {
      const p = Math.min(1, (t - start) / dur);
      const eased = 1 - Math.pow(1 - p, 3);
      setN(to * eased);
      if (p < 1) raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, [to]);
  const fmt = decimals > 0 ? n.toFixed(decimals) : Math.floor(n).toLocaleString('pt-BR');
  return <span ref={ref} style={style}>{fmt}{suffix}</span>;
};

    animationDelay: '0.4s',
  }}>
    {T.showPattern && <Pattern surface="dark" opacity={0.14} scale={1.6}/>}
    <div style={{ position: 'relative', zIndex: 1, display: 'grid', gridTemplateColumns: '1fr 1.6fr', gap: 32 }}>
      <div>
        <div style={{
          fontFamily: 'JetBrains Mono, monospace', fontSize: 10.5, color: T.accent,
          textTransform: 'uppercase', letterSpacing: '0.16em', marginBottom: 12,
        }}>
          ─── Atividade · ao vivo
        </div>
        <h3 style={{
          margin: 0, fontFamily: 'Sora, system-ui', fontWeight: 700,
          fontSize: 'clamp(28px, 3vw, 42px)', letterSpacing: '-0.035em',
          color: 'white', lineHeight: 1.05,
        }}>
          Tudo que acontece no acervo,{' '}
          <span style={{ fontFamily: '"Fraunces", serif', fontStyle: 'italic', fontWeight: 300, color: T.accent }}>
            registrado.
          </span>
        </h3>
        <p style={{
          fontFamily: 'Sora, system-ui', fontSize: 13.5, lineHeight: 1.55,
          color: 'rgba(255,255,255,0.7)', marginTop: 14, maxWidth: 280,
        }}>
          Logs imutáveis com carimbo de hora — exportáveis para auditoria, conformidade LGPD e
          relatórios internos.
        </p>
        <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginTop: 18 }}>
          <span style={{ width: 8, height: 8, borderRadius: '50%', background: C.ok, animation: 'sdx-pulse 1.6s ease-in-out infinite' }}/>
          <span style={{ fontFamily: 'JetBrains Mono, monospace', fontSize: 11, color: 'rgba(255,255,255,0.7)', textTransform: 'uppercase', letterSpacing: '0.1em' }}>
            Sincronizado · agora
          </span>
        </div>
      </div>

      <div style={{ display: 'flex', flexDirection: 'column' }}>
        {ACTIVITY.map((a, i) => (
          <div key={i} style={{
            display: 'flex', alignItems: 'center', gap: 16,
            padding: '12px 0',
            borderBottom: i < ACTIVITY.length - 1 ? '1px solid rgba(255,255,255,0.1)' : 'none',
          }}>
            <div style={{
              fontFamily: 'JetBrains Mono, monospace', fontSize: 11,
              color: 'rgba(255,255,255,0.5)', minWidth: 50,
            }}>{a.t}</div>
            <div style={{ flex: 1, fontFamily: 'Sora, system-ui', fontSize: 13.5, color: 'rgba(255,255,255,0.85)', lineHeight: 1.4 }}>
              <span style={{ color: 'white', fontWeight: 600 }}>{a.who}</span>{' '}
              <span style={{ color: 'rgba(255,255,255,0.6)' }}>{a.what}</span>{' '}
              <span style={{ color: T.accent, fontFamily: '"Fraunces", serif', fontStyle: 'italic' }}>{a.target}</span>
            </div>
          </div>
        ))}
      </div>
    </div>
  </div>
);

// ────────────────────────────────────────────────────────────
// FOOTER STRIP
// ────────────────────────────────────────────────────────────
const FooterStrip = ({ T }) => (
  <div style={{
    display: 'flex', justifyContent: 'space-between', alignItems: 'center',
    padding: '24px 28px', borderTop: `1px solid ${C.line}`, marginTop: 24,
    fontFamily: 'JetBrains Mono, monospace', fontSize: 10.5, color: C.inkMute,
    textTransform: 'uppercase', letterSpacing: '0.12em',
  }}>
    <div style={{ display: 'flex', alignItems: 'center', gap: 16 }}>
      <span>v3.7.4</span>
      <span style={{ width: 4, height: 4, borderRadius: '50%', background: C.inkMute }}/>
      <span style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
        <span style={{ width: 6, height: 6, borderRadius: '50%', background: C.ok, animation: 'sdx-pulse 1.6s ease-in-out infinite' }}/>
        Operacional
      </span>
      <span style={{ width: 4, height: 4, borderRadius: '50%', background: C.inkMute }}/>
      <span>SLA 99,98%</span>
    </div>
    <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
      <span>powered by</span>
      <Wordmark height={14}/>
    </div>
  </div>
);

// ────────────────────────────────────────────────────────────
// SHELL
// ────────────────────────────────────────────────────────────
function App() {
  const [T, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [screen, setScreen] = useState('painel');
  const [dark, setDark] = useState(false);

  return (
    <div style={{ background: C.paper, minHeight: '100vh' }}>
      <TopBar T={T} screen={screen} setScreen={setScreen} dark={dark} setDark={setDark}/>

      <main style={{ maxWidth: 1480, margin: '0 auto' }}>
        <Hero T={T}/>

        <div style={{ display: 'grid', gridTemplateColumns: '1.6fr 1fr', gap: 16, padding: '24px 28px 0' }}>
          <RecentList T={T}/>
          <QueuePanel T={T}/>
        </div>

        <div style={{ padding: '24px 28px 0' }}>
          <QuickModules T={T}/>
        </div>

        <div style={{ padding: '24px 28px 0' }}>
          <ActivityFeed T={T}/>
        </div>

        <FooterStrip T={T}/>
      </main>

      <TweaksPanel>
        <TweakSection label="Identidade" />
        <TweakColor label="Cor primária" value={T.primary}
                    onChange={(v) => setTweak('primary', v)} />
        <TweakColor label="Cor de acento" value={T.accent}
                    onChange={(v) => setTweak('accent', v)} />

        <TweakSection label="Densidade" />
        <TweakRadio label="Espaçamento" value={T.density}
                    options={['compact', 'regular', 'spacious']}
                    onChange={(v) => setTweak('density', v)} />

        <TweakSection label="Decoração" />
        <TweakToggle label="Pattern de fundo" value={T.showPattern}
                     onChange={(v) => setTweak('showPattern', v)} />
      </TweaksPanel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
