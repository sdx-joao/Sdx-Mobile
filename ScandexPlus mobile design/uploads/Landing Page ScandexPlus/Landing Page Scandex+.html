<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<title>Scandex+ — Landing Page</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=Fraunces:ital,wght@0,300;0,400;1,300;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: #F6F7F9; }
  * { box-sizing: border-box; }
  button { transition: filter 0.2s, transform 0.2s, box-shadow 0.2s; }
  button:hover { filter: brightness(0.96); }
  a { transition: opacity 0.2s; }
  a:hover { opacity: 0.6; }
  ::selection { background: #3B7BA8; color: white; }
  @keyframes sdxpulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50%      { transform: scale(1.5); opacity: 0.6; }
  }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="v2-refined-part1.jsx"></script>
<script type="text/babel" src="v2-refined-part2.jsx"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "primary": "#3B7BA8",
  "accent": "#9CC8D6",
  "headline": "controle",
  "patternIntensity": 1
}/*EDITMODE-END*/;

const { Nav, Hero, Metrics } = window.SDXP;
const { About, ScandexPro, Services, Stack, CTA, Footer } = window.SDXP_Sections;

function App() {
  const [T, setTweak] = useTweaks(TWEAK_DEFAULTS);
  return (
    <div style={{ background: '#F6F7F9', minHeight: '100vh' }}>
      <Nav T={T} />
      <Hero T={T} />
      <Metrics T={T} />
      <About T={T} />
      <ScandexPro T={T} />
      <Services T={T} />
      <Stack T={T} />
      <CTA T={T} />
      <Footer T={T} />

      <TweaksPanel>
        <TweakSection label="Identidade" />
        <TweakColor label="Cor primária" value={T.primary}
                    onChange={(v) => setTweak('primary', v)} />
        <TweakColor label="Cor de acento" value={T.accent}
                    onChange={(v) => setTweak('accent', v)} />

        <TweakSection label="Headline" />
        <TweakRadio label="Variação de copy" value={T.headline}
                    options={['controle', 'papel', 'futuro']}
                    onChange={(v) => setTweak('headline', v)} />

        <TweakSection label="Decoração" />
        <TweakSlider label="Intensidade do pattern" value={T.patternIntensity}
                     min={0} max={2} step={0.1}
                     onChange={(v) => setTweak('patternIntensity', v)} />
      </TweaksPanel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
