<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<title>ScandexPRO™ — Entrar (Mobile)</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=Fraunces:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #0F1620; font-family: 'Sora', system-ui, sans-serif; color: #0F1620; -webkit-font-smoothing: antialiased; }
  * { box-sizing: border-box; }
  button, input { font-family: inherit; }
  input:-webkit-autofill { -webkit-box-shadow: 0 0 0 1000px white inset; -webkit-text-fill-color: #0F1620; }
  ::selection { background: #3B7BA8; color: white; }

  #stage {
    min-height: 100%; width: 100%;
    display: flex; align-items: center; justify-content: center;
    padding: 28px;
    background:
      radial-gradient(120% 80% at 50% -10%, #1a2738 0%, #0F1620 55%);
  }

  @keyframes float-y {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-8px); }
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .reveal { animation: fadeUp .7s cubic-bezier(.2,.8,.2,1) both; }
  .reveal-1 { animation-delay: .05s; }
  .reveal-2 { animation-delay: .16s; }
  .reveal-3 { animation-delay: .30s; }
  .reveal-4 { animation-delay: .44s; }

  /* Login button — solid white circle expanding from center on hover */
  .sdx-login-btn__wash {
    position: absolute; top: 50%; left: 50%;
    width: 20px; height: 20px; border-radius: 50%;
    background: #ffffff;
    transform: translate(-50%, -50%) scale(0);
    pointer-events: none; z-index: 0;
    transition: transform 1.1s cubic-bezier(.22,.65,.3,.99);
  }
  .sdx-login-btn:hover .sdx-login-btn__wash { transform: translate(-50%, -50%) scale(40); }
  .sdx-login-btn:hover { color: #0F1620 !important; }
  .sdx-login-btn:hover svg { stroke: #0F1620; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="ios-frame.jsx"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useRef } = React;

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "primary": "#3B7BA8",
  "accent": "#9CC8D6"
}/*EDITMODE-END*/;

// ── Brand tokens — herdados da landing ──────────────────────
const C = {
  blue: '#3B7BA8', blueDeep: '#2E6388', blueLight: '#9CC8D6',
  blueTint: '#EAF2F6', ink: '#0F1620', inkSoft: '#5A6573',
  inkMute: '#8A95A3', line: '#E2E8EE', lineSoft: '#EEF1F4',
  paper: '#F6F7F9', white: '#FFFFFF', err: '#C2453E',
};
const PALE_BG = '#E2EBF1';

const Wordmark = ({ height = 22, variant = 'dark' }) => {
  const w = height * (586/151);
  return (
    <img
      src={variant === 'white' ? 'assets/logo-principal-white.png' : 'assets/logo-principal-cropped.png'}
      alt="Scandex+"
      style={{ height, width: w, objectFit: 'contain', display: 'inline-block', verticalAlign: 'middle' }}
    />
  );
};

// ── Brand zone (top) — faixa de cor sólida ───────────────────
const BrandZone = ({ T }) => (
  <div style={{
    position: 'relative', background: T.primary,
    padding: '84px 30px 90px', overflow: 'hidden', flexShrink: 0,
    display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', gap: 26,
  }}>
    {/* wordmark branco — hero */}
    <div className="reveal reveal-1" style={{ position: 'relative', zIndex: 1, display: 'flex', justifyContent: 'center' }}>
      <Wordmark height={50} variant="white"/>
    </div>

    {/* eyebrow */}
    <div className="reveal reveal-2" style={{
      position: 'relative', zIndex: 1,
      display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 12,
      fontFamily: 'JetBrains Mono, monospace', fontSize: 10.5, color: 'rgba(255,255,255,0.82)',
      textTransform: 'uppercase', letterSpacing: '0.18em', textAlign: 'center',
    }}>
      <span style={{ width: 24, height: 1, background: 'rgba(255,255,255,0.55)' }}/>
      Gestão eletrônica de documentos
    </div>
  </div>
);

// ── Field ───────────────────────────────────────────────────
const Field = ({ label, input, trailing, T }) => {
  const ref = useRef();
  const [focus, setFocus] = useState(false);
  const styled = React.cloneElement(input, {
    ref,
    onFocus: (e) => { setFocus(true); input.props.onFocus?.(e); },
    onBlur:  (e) => { setFocus(false); input.props.onBlur?.(e); },
    style: {
      width: '100%', border: 'none', outline: 'none', background: 'transparent',
      fontFamily: 'Sora, system-ui', fontSize: 15, fontWeight: 500,
      color: C.ink, padding: '13px 0', letterSpacing: '-0.005em',
      ...(input.props.style || {}),
    },
  });
  return (
    <div>
      <div style={{
        fontFamily: 'JetBrains Mono, monospace', fontSize: 10, color: focus ? T.primary : C.inkMute,
        textTransform: 'uppercase', letterSpacing: '0.16em', marginBottom: 6,
        transition: 'color .15s',
      }}>{label}</div>
      <div style={{
        display: 'flex', alignItems: 'center', gap: 10, padding: '0 14px',
        background: 'white', border: `1.5px solid ${focus ? T.primary : C.line}`,
        borderRadius: 12,
        boxShadow: focus ? `0 0 0 4px ${T.primary}1f` : 'none',
        transition: 'all .15s',
      }} onClick={() => ref.current?.focus()}>
        {styled}
        {trailing}
      </div>
    </div>
  );
};

const EyeIcon = ({ open }) => (
  <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round">
    {open ? (<><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></>)
          : (<><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></>)}
  </svg>
);

// ── Form sheet (bottom) ─────────────────────────────────────
const FormSheet = ({ T, onSubmit }) => {
  const [user, setUser] = useState('');
  const [pass, setPass] = useState('');
  const [showPass, setShowPass] = useState(false);
  const [remember, setRemember] = useState(true);
  const [loading, setLoading] = useState(false);
  const [err, setErr] = useState('');

  const submit = (e) => {
    e.preventDefault();
    setErr('');
    if (!user || !pass) { setErr('Preencha usuário e senha.'); return; }
    setLoading(true);
    setTimeout(() => { setLoading(false); onSubmit?.(); }, 900);
  };

  return (
    <div style={{
      position: 'relative', zIndex: 2, flex: 1, marginTop: -32,
      background: 'white', borderTopLeftRadius: 28, borderTopRightRadius: 28,
      padding: '30px 30px 36px',
      display: 'flex', flexDirection: 'column',
      boxShadow: '0 -8px 30px rgba(15,22,32,0.06)',
    }}>
      {/* grip */}
      <div style={{
        width: 40, height: 4, borderRadius: 99, background: C.line,
        margin: '0 auto 22px',
      }}/>

      <div className="reveal reveal-3">
        <div style={{
          fontFamily: 'JetBrains Mono, monospace', fontSize: 10, color: T.primary,
          textTransform: 'uppercase', letterSpacing: '0.18em', marginBottom: 12,
          display: 'flex', alignItems: 'center', gap: 10,
        }}>
          <span style={{ width: 18, height: 1, background: T.primary }}/>
          Acesso ao sistema
        </div>
        <h1 style={{
          margin: 0, fontFamily: 'Sora, system-ui', fontWeight: 700,
          fontSize: 32, lineHeight: 1.0, letterSpacing: '-0.035em', color: C.ink,
        }}>
          Bem-vindo de{' '}
          <span style={{ fontFamily: '"Fraunces", serif', fontStyle: 'italic', fontWeight: 400, color: T.primary }}>volta</span>.
        </h1>
        <p style={{
          fontFamily: 'Sora, system-ui', fontSize: 13.5, lineHeight: 1.5,
          color: C.inkSoft, marginTop: 10, marginBottom: 0,
        }}>
          Insira suas credenciais para acessar o ScandexPRO™.
        </p>
      </div>

      <form onSubmit={submit} className="reveal reveal-4" style={{ marginTop: 26, display: 'flex', flexDirection: 'column', gap: 15 }}>
        <Field label="Usuário" T={T} input={
          <input type="text" placeholder="seu.usuario" value={user}
                 onChange={(e) => { setUser(e.target.value); setErr(''); }} autoComplete="username"/>
        }/>
        <Field label="Senha" T={T}
          trailing={
            <button type="button" onClick={() => setShowPass(!showPass)} title={showPass ? 'Esconder' : 'Mostrar'} style={{
              background: 'transparent', border: 'none', cursor: 'pointer', padding: 4,
              color: C.inkMute, display: 'flex', alignItems: 'center',
            }}><EyeIcon open={!showPass}/></button>
          }
          input={
            <input type={showPass ? 'text' : 'password'} placeholder="••••••••" value={pass}
                   onChange={(e) => { setPass(e.target.value); setErr(''); }} autoComplete="current-password"/>
          }
        />

        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginTop: 2 }}>
          <label style={{
            display: 'inline-flex', alignItems: 'center', gap: 8, cursor: 'pointer',
            fontFamily: 'Sora, system-ui', fontSize: 12.5, color: C.inkSoft,
          }}>
            <span style={{
              width: 17, height: 17, borderRadius: 5,
              border: `1.5px solid ${remember ? T.primary : C.line}`,
              background: remember ? T.primary : 'white',
              display: 'flex', alignItems: 'center', justifyContent: 'center', transition: 'all .15s',
            }}>
              {remember && (
                <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="3.5" strokeLinecap="round" strokeLinejoin="round">
                  <polyline points="20 6 9 17 4 12"/>
                </svg>
              )}
            </span>
            <input type="checkbox" checked={remember} onChange={(e) => setRemember(e.target.checked)}
                   style={{ position: 'absolute', opacity: 0, pointerEvents: 'none' }}/>
            Manter conectado
          </label>
          <a href="#" style={{
            fontFamily: 'Sora, system-ui', fontSize: 12.5, fontWeight: 500, color: T.primary,
            textDecoration: 'none', borderBottom: `1px solid ${T.primary}44`, paddingBottom: 1,
          }}>Esqueci a senha</a>
        </div>

        {err && (
          <div style={{
            padding: '10px 14px', borderRadius: 10,
            background: `${C.err}10`, border: `1px solid ${C.err}40`,
            fontFamily: 'Sora, system-ui', fontSize: 12.5, color: C.err,
            display: 'flex', alignItems: 'center', gap: 10,
          }}>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
              <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
            </svg>
            {err}
          </div>
        )}

        <button type="submit" disabled={loading} className="sdx-login-btn" style={{
          marginTop: 6, padding: '16px 24px',
          background: loading ? C.blueDeep : T.primary, color: 'white',
          border: 'none', borderRadius: 12, cursor: loading ? 'wait' : 'pointer',
          fontFamily: 'Sora, system-ui', fontSize: 15, fontWeight: 600,
          display: 'inline-flex', alignItems: 'center', justifyContent: 'center', gap: 10,
          boxShadow: `0 10px 28px ${T.primary}33`,
          position: 'relative', overflow: 'hidden', isolation: 'isolate',
          letterSpacing: '-0.005em', transition: 'color .25s ease',
        }}>
          <span className="sdx-login-btn__wash" aria-hidden="true"/>
          <span style={{ position: 'relative', zIndex: 1, display: 'inline-flex', alignItems: 'center', gap: 10 }}>
            {loading ? (
              <>
                <span style={{
                  width: 16, height: 16, border: '2px solid rgba(255,255,255,0.4)',
                  borderTopColor: 'white', borderRadius: '50%', animation: 'spin .7s linear infinite',
                }}/>
                Autenticando...
              </>
            ) : (
              <>
                Entrar no sistema
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                  <line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/>
                </svg>
              </>
            )}
          </span>
        </button>
      </form>

      {/* spacer pushes footer down */}
      <div style={{ flex: 1, minHeight: 18 }}/>

      <div style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 7, justifyContent: 'center', flexWrap: 'wrap' }}>
          {['LGPD', 'ISO 27001', 'Auditável'].map(t => (
            <span key={t} style={{
              fontFamily: 'JetBrains Mono, monospace', fontSize: 9, fontWeight: 500,
              color: C.inkSoft, textTransform: 'uppercase', letterSpacing: '0.12em',
              padding: '4px 10px', border: `1px solid ${C.line}`, borderRadius: 999, background: 'white',
            }}>{t}</span>
          ))}
        </div>
        <div style={{
          display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 8,
          fontFamily: 'Sora, system-ui', fontSize: 12.5, color: C.inkSoft,
        }}>
          <span style={{ fontStyle: 'italic', fontFamily: '"Fraunces", serif', fontWeight: 400 }}>powered by</span>
          <Wordmark height={18}/>
        </div>
      </div>
    </div>
  );
};

// ── Screen ──────────────────────────────────────────────────
const Screen = ({ T }) => (
  <div style={{
    minHeight: '100%', display: 'flex', flexDirection: 'column',
    background: PALE_BG, fontFamily: 'Sora, system-ui',
  }}>
    <BrandZone T={T}/>
    <FormSheet T={T} onSubmit={() => alert('Login!')}/>
  </div>
);

function App() {
  const [T, setTweak] = useTweaks(TWEAK_DEFAULTS);
  return (
    <div id="stage">
      <IOSDevice>
        <Screen T={T}/>
      </IOSDevice>

      <TweaksPanel>
        <TweakSection label="Identidade" />
        <TweakColor label="Cor primária" value={T.primary} onChange={(v) => setTweak('primary', v)} />
        <TweakColor label="Cor de acento" value={T.accent} onChange={(v) => setTweak('accent', v)} />

      </TweaksPanel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
