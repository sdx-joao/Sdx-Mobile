# Codemagic — build do AAB do Servus-SDX (Expo managed) sem usar a cota do EAS.
# (ex-Sdx-Mobile; package mantido com.sdxpro.mobile p/ a Play aceitar como atualizacao.)
# Dois workflows: TESTE (backend app-test, cinza) e PRODUCAO (backend app real).
#
# Pre-requisito (UI do Codemagic -> Code signing identities -> Android keystores):
#   O keystore continua com reference name "sdxmobile_keystore" (o MESMO de sempre,
#   nao renomear na UI senao o build quebra).

definitions:
  scripts:
    - &deps
      name: Instalar dependencias
      script: npm ci
    - &google_services
      name: Restaurar google-services.json (FCM)
      # O arquivo saiu do git (contem a Google API key). Aqui ele e recriado a
      # partir da variavel SEGURA GOOGLE_SERVICES_JSON_BASE64 (definida na UI do
      # Codemagic, grupo "firebase"). Sem ela, o build falha de proposito.
      script: |
        if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
          echo "ERRO: variavel GOOGLE_SERVICES_JSON_BASE64 nao definida (UI -> Environment variables, grupo firebase)."
          exit 1
        fi
        echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > google-services.json
        echo "google-services.json restaurado ($(wc -c < google-services.json) bytes)."
    - &app_config
      name: versionCode dinamico + canal OTA
      # versionCode = minutos desde 2024-01-01 -> sempre unico e crescente. E grava
      # o canal OTA (EXPO_UPDATE_CHANNEL) no updates.requestHeaders pra o build puxar
      # os updates certos (prod x test). Patcha o app.json antes do prebuild.
      script: |
        VC=$(( ( $(date +%s) - 1704067200 ) / 60 ))
        node -e "const f='app.json';const j=require('./'+f);j.expo.android.versionCode=$VC;if(process.env.EXPO_UPDATE_CHANNEL){j.expo.updates=j.expo.updates||{};j.expo.updates.requestHeaders=j.expo.updates.requestHeaders||{};j.expo.updates.requestHeaders['expo-channel-name']=process.env.EXPO_UPDATE_CHANNEL;}require('fs').writeFileSync(f,JSON.stringify(j,null,2));console.log('versionCode',$VC,'| canal',process.env.EXPO_UPDATE_CHANNEL||'(default)')"
    - &prebuild
      name: Expo prebuild (android)
      script: npx expo prebuild --platform android --no-install
    - &build
      name: Build AAB assinado
      script: |
        cd android
        ./gradlew bundleRelease \
          -Pandroid.injected.signing.store.file="$CM_KEYSTORE_PATH" \
          -Pandroid.injected.signing.store.password="$CM_KEYSTORE_PASSWORD" \
          -Pandroid.injected.signing.key.alias="$CM_KEY_ALIAS" \
          -Pandroid.injected.signing.key.password="$CM_KEY_PASSWORD"
  artifacts: &artifacts
    - android/app/build/outputs/bundle/release/*.aab
  publishing: &publishing
    email:
      recipients:
        - silvaoliveiraj@gmail.com
      notify:
        success: true
        failure: true

workflows:
  servus-test:
    name: Servus-SDX — Android AAB (TESTE / app-test)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: 20.18.0
      android_signing:
        - sdxmobile_keystore
      groups:
        - firebase
      vars:
        EXPO_PUBLIC_SDX_API_URL: "https://app-test.scandexplus.com.br"
        EXPO_PUBLIC_APP_ENV: "test"
        EXPO_UPDATE_CHANNEL: "test"
        # Sentry: source maps DESLIGADOS por ora (upload derrubava o bundleRelease).
        SENTRY_DISABLE_AUTO_UPLOAD: "true"
    scripts:
      - *deps
      - *google_services
      - *app_config
      - *prebuild
      - *build
    artifacts: *artifacts
    publishing: *publishing

  servus-prod:
    name: Servus-SDX — Android AAB (PRODUCAO / app)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: 20.18.0
      android_signing:
        - sdxmobile_keystore
      groups:
        - firebase
      vars:
        EXPO_PUBLIC_SDX_API_URL: "https://app.scandexplus.com.br"
        EXPO_PUBLIC_APP_ENV: "production"
        EXPO_UPDATE_CHANNEL: "production"
        # Sentry: source maps DESLIGADOS por ora (upload derrubava o bundleRelease).
        SENTRY_DISABLE_AUTO_UPLOAD: "true"
    scripts:
      - *deps
      - *google_services
      - *app_config
      - *prebuild
      - *build
    artifacts: *artifacts
    publishing: *publishing

  # ── OTA: publica atualizacao de JS/telas SEM build na Play (instantaneo) ──
  # Requer EXPO_TOKEN (grupo "expo" na UI do Codemagic) e o canal ja criado 1x:
  #   npx eas channel:create production   (e test)
  servus-ota-prod:
    name: Servus-SDX — OTA update (PRODUCAO)
    instance_type: mac_mini_m2
    max_build_duration: 20
    environment:
      node: 20.18.0
      groups:
        - expo
      vars:
        EXPO_PUBLIC_SDX_API_URL: "https://app.scandexplus.com.br"
        EXPO_PUBLIC_APP_ENV: "production"
    scripts:
      - *deps
      - name: Publicar OTA (EAS Update)
        script: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "ERRO: EXPO_TOKEN nao definido (UI -> Environment variables, grupo expo)."
            exit 1
          fi
          npx eas update --branch production --message "${CM_COMMIT_MESSAGE:-OTA update}" --non-interactive
    publishing: *publishing

  servus-ota-test:
    name: Servus-SDX — OTA update (TESTE)
    instance_type: mac_mini_m2
    max_build_duration: 20
    environment:
      node: 20.18.0
      groups:
        - expo
      vars:
        EXPO_PUBLIC_SDX_API_URL: "https://app-test.scandexplus.com.br"
        EXPO_PUBLIC_APP_ENV: "test"
    scripts:
      - *deps
      - name: Publicar OTA (EAS Update)
        script: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "ERRO: EXPO_TOKEN nao definido (grupo expo)."
            exit 1
          fi
          npx eas update --branch test --message "${CM_COMMIT_MESSAGE:-OTA update}" --non-interactive
    publishing: *publishing
